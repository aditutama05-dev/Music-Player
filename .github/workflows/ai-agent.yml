name: Autonomous Coding Agent

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_PROMPT: ${{ github.event.issue.title }} - ${{ github.event.issue.body }}
        run: python .github/scripts/agent.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: update by AI agent based on issue #${{ github.event.issue.number }}"
          title: "Solusi Otomatis untuk: ${{ github.event.issue.title }}"
          body: "Pull request ini dibuat otomatis oleh AI Agent berdasarkan issue #${{ github.event.issue.number }}."
          branch: "ai-patch-${{ github.event.issue.number }}"
          base: main
          
