name: Build and Release App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Release Version Tag
        id: version
        run: |
          TAG_NAME="v1.0.$(date +'%Y%m%d%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Bundle Web App Artifact
        run: |
          mkdir -p dist
          cp -r ./* dist/ 2>/dev/null || true
          rm -rf dist/dist dist/.git dist/.github
          cd dist && zip -r ../personal-ai-package.zip ./* && cd ..

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          body: |
            Build otomatis berhasil selesai.
            - Status: Sukses
            - Sumber: Commit `${{ github.sha }}`
          files: personal-ai-package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
