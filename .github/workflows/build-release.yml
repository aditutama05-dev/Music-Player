name: Build and Release App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Web Core Files
        run: |
          echo "Memeriksa kelengkapan file..."
          for file in index.html style.css app.js sw.js manifest.json icon.svg github.js pwa-register.js; do
            if [ ! -f "$file" ]; then
              echo "Error: File $file tidak ditemukan!"
              exit 1
            fi
          done
          echo "Semua file inti lengkap."

      - name: Generate Release Version Tag
        id: version
        run: |
          TAG_NAME="v1.0.$(date +'%Y%m%d%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Bundle Web App Artifact
        run: |
          mkdir -p dist
          cp -r index.html style.css app.js sw.js manifest.json icon.svg github.js pwa-register.js dist/
          cd dist && zip -r ../personal-ai-package.zip ./* && cd ..

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Personal AI Release ${{ steps.version.outputs.tag_name }}
          body: |
            Build otomatis Personal AI Codex berhasil selesai.
            - Status: Sukses terkompilasi
            - Commit: `${{ github.sha }}`
            - Paket: `personal-ai-package.zip` (berisi seluruh modul PWA, GitHub Codex, & Style)
          files: personal-ai-package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
