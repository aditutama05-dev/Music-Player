name: Build and Release App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Fallback PNG Icon
        run: |
          node generate-icon.js

      - name: Verify Web Core Files
        run: |
          echo "Memeriksa kelengkapan file..."
          for file in index.html style.css app.js sw.js manifest.json icon.svg icon-512.png github.js copy-helper.js pwa-register.js; do
            if [ ! -f "$file" ]; then
              echo "Error: File $file tidak ditemukan!"
              exit 1
            fi
          done
          echo "Semua file inti lengkap dan terverifikasi."

      - name: Generate Release Version Tag
        id: version
        run: |
          TAG_NAME="v1.1.$(date +'%Y%m%d%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Bundle Web App Artifact
        run: |
          mkdir -p dist
          cp -r index.html style.css app.js sw.js manifest.json icon.svg icon-512.png github.js copy-helper.js pwa-register.js dist/
          cd dist && zip -r ../personal-ai-package.zip ./* && cd ..

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Personal AI Release ${{ steps.version.outputs.tag_name }}
          body: |
            Build otomatis Personal AI Codex (Pembaruan UI & Isolasi Mode).
            - Status: Sukses terkompilasi
            - Commit: `${{ github.sha }}`
            - Pembaruan: Ikon salin dokumen, tombol tambah (+), isolasi sesi chat per mode, auto-detect prompt gambar.
          files: personal-ai-package.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
